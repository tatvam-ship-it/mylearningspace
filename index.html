<!doctype html>
<html lang="en" data-bg="auto" data-size="1" data-font="lexend">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyLearningSpace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: sticky app bar, bottom tab bar on phones, cards on a cool paper ground. Colour comes from one accent plus a hue per subject. */
:root{--bg:#f3f6fb;--card:#fff;--ink:#12203a;--soft:#56627a;--line:#e0e6f0;--accent:#2f5bea;--accent-ink:#fff;--tint:#e7edfd;--good:#17803d;--good-bg:#e4f5ea;--bad:#c0362c;--bad-bg:#fdeceb;--warn-bg:#fff4d6;--hero:#2447c4;--shadow:0 1px 2px rgba(18,32,58,.06),0 10px 28px rgba(18,32,58,.07)}
:root[data-bg="cream"]{--bg:#fbf6e9;--card:#fffdf7;--line:#e8dec4;--tint:#f0ecdb}
:root[data-bg="white"]{--bg:#fff;--card:#fff;--line:#d3dae6;--shadow:none}
:root[data-bg="blue"]{--bg:#e1eefb;--card:#f5faff;--line:#bcd6ec;--tint:#d9e7fb}
:root[data-bg="dark"]{--bg:#0d1526;--card:#151f38;--ink:#eef2fb;--soft:#a8b3cc;--line:#26345a;--accent:#86a8ff;--accent-ink:#0b1430;--tint:#1d2b52;--good:#62d48f;--good-bg:#12352a;--bad:#ff8f86;--bad-bg:#3b1c22;--warn-bg:#3a3217;--hero:#1b2d66;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}
@media (prefers-color-scheme:dark){:root[data-bg="auto"]:not([data-theme="light"]){--bg:#0d1526;--card:#151f38;--ink:#eef2fb;--soft:#a8b3cc;--line:#26345a;--accent:#86a8ff;--accent-ink:#0b1430;--tint:#1d2b52;--good:#62d48f;--good-bg:#12352a;--bad:#ff8f86;--bad-bg:#3b1c22;--warn-bg:#3a3217;--hero:#1b2d66;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-bg="auto"][data-theme="dark"]{--bg:#0d1526;--card:#151f38;--ink:#eef2fb;--soft:#a8b3cc;--line:#26345a;--accent:#86a8ff;--accent-ink:#0b1430;--tint:#1d2b52;--good:#62d48f;--good-bg:#12352a;--bad:#ff8f86;--bad-bg:#3b1c22;--warn-bg:#3a3217;--hero:#1b2d66;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}
:root[data-size="2"]{font-size:125%}:root[data-size="3"]{font-size:150%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.75 Lexend,Verdana,sans-serif;letter-spacing:.02em;word-spacing:.1em}
:root[data-font="atkinson"] body{font-family:"Atkinson Hyperlegible",Verdana,sans-serif}
:root[data-font="opendyslexic"] body{font-family:OpenDyslexic,"Comic Sans MS","Comic Neue",Verdana,sans-serif}
:root[data-font="verdana"] body{font-family:Verdana,Tahoma,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
[hidden]{display:none!important}
h1,h2,h3{line-height:1.25;margin:0;text-wrap:balance}
p{margin:.5rem 0}a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:68rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:1rem;padding-block:.6rem}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:700;font-size:1.1rem;color:var(--ink);text-decoration:none;margin-right:auto}
.mark{width:2.2rem;height:2.2rem;border-radius:.65rem;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
#nav{display:flex;gap:.15rem}
#nav a{display:flex;align-items:center;gap:.4rem;padding:.5rem .75rem;border-radius:.7rem;color:var(--soft);text-decoration:none;font-weight:600;font-size:.9rem}
#nav a:hover{color:var(--ink)}
#nav a[aria-current=page]{background:var(--tint);color:var(--accent)}
main{padding-top:.5rem;padding-bottom:3rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font:inherit;font-weight:600;letter-spacing:inherit;background:var(--accent);color:var(--accent-ink);border:1.5px solid var(--accent);border-radius:.85rem;padding:.65rem 1.25rem;min-height:2.9rem;cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(47,91,234,.28)}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}.btn.alt:hover{border-color:var(--accent);box-shadow:none}
.btn.tone{background:var(--tint);color:var(--accent);border-color:transparent}.btn.tone:hover{box-shadow:none}
.btn.light{background:#fff;color:#1b3aa8;border-color:#fff}.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.btn.wide{width:100%}
.row{display:flex;flex-wrap:wrap;gap:.7rem;margin:1rem 0}
.pill{display:inline-flex;gap:.4rem;align-items:center;padding:.2rem .75rem;border-radius:99px;background:var(--tint);color:var(--accent);font-size:.85rem;font-weight:600}
.hero .pill{background:rgba(255,255,255,.16);color:#fff}
.hero{display:grid;grid-template-columns:1.15fr .85fr;align-items:center;gap:1rem;background:var(--hero);color:#fff;border-radius:1.6rem;padding:2rem 2rem 2rem 2.4rem;margin-top:1.25rem;overflow:hidden}
.hero h1{font-size:clamp(1.7rem,3.6vw,2.5rem);margin:.8rem 0 .6rem;color:#fff}
.hero p{max-width:46ch;color:rgba(255,255,255,.9);margin:0 0 1.2rem}
.hero .row{margin:0}
.hero-a svg{width:100%;height:auto;display:block;max-height:17rem}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:2rem 0 .9rem}
.sec-h h2{font-size:1.3rem}.lnk{font-weight:600;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:1rem}
.bub{width:3rem;height:3rem;border-radius:.95rem;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c,var(--accent)) 16%,var(--card));color:color-mix(in srgb,var(--c,var(--accent)) 78%,var(--ink))}
.bub.lg{width:3.6rem;height:3.6rem;border-radius:1.1rem}.bub.sm{width:2.4rem;height:2.4rem;border-radius:.75rem}
.sub{position:relative;display:flex;flex-direction:column;gap:.15rem;padding:1.1rem;background:var(--card);border:1px solid var(--line);border-radius:1.1rem;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);transition:transform .15s,border-color .15s}
.sub:hover{transform:translateY(-2px);border-color:var(--c)}
.sub .bub{margin-bottom:.7rem}.st{font-weight:700;font-size:1.05rem;line-height:1.35}.ss{color:var(--soft);font-size:.88rem}
.go{position:absolute;top:1.2rem;right:1.1rem;color:var(--soft)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.help{display:flex;gap:1rem;align-items:center;padding:1.1rem;background:var(--card);border:1px solid var(--line);border-radius:1.1rem;box-shadow:var(--shadow);text-decoration:none;color:var(--ink)}
.help:hover{border-color:var(--c)}.help strong{display:block}.help span.d{color:var(--soft);font-size:.9rem;line-height:1.5;display:block}
.ph h1{margin:1.5rem 0 .25rem;font-size:clamp(1.6rem,3vw,2.1rem)}.sub-t{color:var(--soft);margin:0 0 1rem}
.search{position:relative;max-width:28rem;margin:1rem 0 1.25rem}
.search svg{position:absolute;left:.9rem;top:50%;transform:translateY(-50%);color:var(--soft)}.search input{padding-left:2.8rem}
.crumbs{display:flex;flex-wrap:wrap;gap:.5rem;color:var(--soft);font-size:.9rem;margin:1.2rem 0 .8rem}.crumbs a{text-decoration:none;font-weight:600}
.banner{display:flex;gap:1rem;align-items:center;padding:1.2rem;border-radius:1.3rem;background:color-mix(in srgb,var(--c) 14%,var(--card));border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));margin-bottom:1.2rem}
.banner h1{font-size:clamp(1.5rem,3vw,2rem)}.banner p{margin:.2rem 0 0;color:var(--soft)}
.rows{display:grid;gap:.6rem}
.rw{display:flex;align-items:center;gap:.9rem;padding:.8rem 1rem;background:var(--card);border:1px solid var(--line);border-radius:1rem;text-decoration:none;color:var(--ink);font-weight:600}
.rw:hover{border-color:var(--c);transform:translateX(2px)}.rw .rt{flex:1}.rw>svg{color:var(--soft)}
.seg{display:flex;flex-wrap:wrap;gap:.5rem;margin:.3rem 0 1.2rem}
.seg button{display:inline-flex;align-items:center;gap:.5rem;font:inherit;letter-spacing:inherit;padding:.55rem 1rem;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.seg button[aria-pressed=true]{border-color:var(--accent);background:var(--tint);color:var(--accent);font-weight:600}
.dot{width:.9rem;height:.9rem;border-radius:50%;border:1px solid var(--soft)}
.lbl{display:block;font-weight:600;font-size:.92rem;margin:1rem 0 .3rem}
.lh{display:flex;gap:1rem;align-items:center;margin-bottom:1rem}.lh h1{font-size:clamp(1.4rem,3vw,2rem);margin-bottom:.25rem}
.steps{display:flex;gap:.3rem;padding:.3rem;background:var(--card);border:1px solid var(--line);border-radius:1rem;overflow-x:auto}
.steps button{flex:1;display:flex;align-items:center;justify-content:center;gap:.45rem;font:inherit;font-size:.92rem;letter-spacing:inherit;padding:.6rem .5rem;border:0;border-bottom:3px solid transparent;border-radius:.75rem;background:transparent;color:var(--soft);cursor:pointer;white-space:nowrap}
.steps button[aria-selected=true]{background:color-mix(in srgb,var(--c) 16%,var(--card));color:color-mix(in srgb,var(--c) 70%,var(--ink));border-bottom-color:var(--c);font-weight:600}
.prog{height:.4rem;border-radius:99px;background:var(--line);margin:.7rem 0 1rem;overflow:hidden}.prog i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .3s}
.lcard{background:var(--card);border:1px solid var(--line);border-radius:1.3rem;padding:1.5rem;box-shadow:var(--shadow)}
.lcard h2{font-size:.85rem;text-transform:uppercase;letter-spacing:.12em;color:var(--soft);margin-bottom:1rem}
.read{font-size:1.15rem;line-height:1.9;max-width:62ch;margin:.6rem 0}
.vis{display:grid;place-items:center;height:10rem;border-radius:1.1rem;background:color-mix(in srgb,var(--c) 14%,var(--card));font:5rem/1 "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.ex{display:flex;gap:1rem;align-items:flex-start}.exi{flex:none;width:2.8rem;height:2.8rem;border-radius:.9rem;display:grid;place-items:center;background:var(--warn-bg);color:#b45309}
.vid{display:grid;place-items:center;align-content:center;gap:.6rem;aspect-ratio:16/8;border-radius:1.1rem;background:#0f172a;color:#fff;text-decoration:none}
.vp{width:4.4rem;height:4.4rem;border-radius:50%;background:#ff0033;display:grid;place-items:center;transition:transform .15s}.vid:hover .vp{transform:scale(1.07)}.vl{font-weight:600}
.note{color:var(--soft);font-size:.9rem;max-width:62ch}
.qn{color:var(--soft);font-weight:600;margin:0}.q{margin-top:.2rem}
.opt{display:flex;align-items:center;gap:.8rem;width:100%;text-align:left;font:inherit;font-size:1.05rem;letter-spacing:inherit;padding:.85rem 1rem;margin:.55rem 0;background:var(--card);border:1.5px solid var(--line);border-radius:.9rem;color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--c)}.opt:disabled{cursor:default}
.ltr{width:2rem;height:2rem;border-radius:.6rem;display:grid;place-items:center;background:var(--tint);color:var(--accent);font-weight:700;flex:none}
.opt>svg:last-child{margin-left:auto;flex:none}
.opt.right{border-color:var(--good);background:var(--good-bg)}.opt.right>svg{color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}.opt.wrong>svg{color:var(--bad)}
.fbox{display:flex;gap:.7rem;align-items:flex-start;padding:.9rem 1rem;border-radius:.9rem;margin:.9rem 0}
.fbox.ok{background:var(--good-bg);color:var(--good)}.fbox.no{background:var(--bad-bg);color:var(--bad)}.fbox span{color:var(--ink)}.fbox>svg{flex:none;margin-top:.15rem}
.done{display:grid;justify-items:center;text-align:center;gap:.2rem}.done h3{font-size:1.5rem;margin-top:.5rem}
.act{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.7rem;margin:1.2rem 0}.act .grp{display:flex;flex-wrap:wrap;gap:.6rem}
.qh{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap}
.lv{padding:.15rem .75rem;border-radius:99px;font-size:.82rem;font-weight:700}
.lv.e{background:var(--good-bg);color:var(--good)}.lv.m{background:var(--warn-bg);color:var(--ink)}.lv.h{background:var(--bad-bg);color:var(--bad)}
.qbar{height:.35rem;border-radius:99px;background:var(--line);margin:.5rem 0 .9rem;overflow:hidden}.qbar i{display:block;height:100%;background:var(--c);transition:width .3s}
.brk{display:grid;gap:.5rem;width:100%;max-width:22rem;margin:.8rem 0}.brk div{display:flex;justify-content:space-between;align-items:center;gap:.6rem}
.vf{margin:0 0 1.2rem}.vwrap{position:relative;padding-top:56.25%;border-radius:1rem;overflow:hidden;background:#0f172a}.vwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.vf figcaption{display:flex;flex-wrap:wrap;gap:.3rem 1rem;justify-content:space-between;margin-top:.6rem}.vf figcaption a{font-size:.9rem}
.skel{display:grid;gap:.7rem}.skel i{height:1rem;border-radius:99px;background:linear-gradient(90deg,var(--line),var(--tint),var(--line));background-size:200% 100%;animation:sh 1.4s infinite}.skel i:nth-child(2){width:85%}.skel i:nth-child(3){width:60%}
@keyframes sh{to{background-position:-200% 0}}
.field{margin:.85rem 0}.field label{display:block;font-weight:600;font-size:.92rem;margin-bottom:.3rem}
input[type=text],input[type=password],input[type=search],select,textarea{width:100%;font:inherit;letter-spacing:inherit;padding:.7rem .9rem;min-height:3rem;border:1.5px solid var(--line);border-radius:.85rem;background:var(--card);color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 .8rem}
.chk{display:flex;gap:.5rem;align-items:center;font-size:.92rem;color:var(--soft);margin:.4rem 0}.chk input{width:1.1rem;height:1.1rem;accent-color:var(--accent)}
.err{color:var(--bad);font-weight:600;min-height:1.5rem;margin:.3rem 0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:1.3rem;padding:1.3rem;box-shadow:var(--shadow)}
.empty{padding:1.2rem;border:2px dashed var(--line);border-radius:1rem;color:var(--soft)}
.auth{display:grid;grid-template-columns:1fr 1fr;margin:1.2rem auto;max-width:62rem;background:var(--card);border:1px solid var(--line);border-radius:1.6rem;overflow:hidden;box-shadow:var(--shadow)}
.auth-art{background:var(--hero);color:#fff;padding:2rem;display:flex;flex-direction:column;gap:1rem}
.auth-art .brand{color:#fff}.auth-art .mark{background:#fff;color:#1b3aa8}
.auth-art h2{font-size:1.6rem;margin-top:.5rem;color:#fff}
.auth-art ul{list-style:none;padding:0;margin:0;display:grid;gap:.6rem}.auth-art li{display:flex;gap:.6rem;align-items:center;color:rgba(255,255,255,.92)}
.auth-art li svg{background:rgba(255,255,255,.18);border-radius:50%;padding:.2rem;flex:none}
.auth-art svg.art{width:100%;height:auto;margin-top:auto}
.auth-form{padding:2rem 2.2rem}.auth-form h1{font-size:1.7rem;margin:.6rem 0 .2rem}
.auth-form .alt-l{text-align:center;margin:1rem 0 .3rem}
.auth-form .brand{display:none}
.panel>.lbl:first-child{margin-top:0}
.banner .bub{background:var(--card)}
.notice{background:var(--warn-bg);border-radius:1rem;padding:1rem;margin:1rem 0}.notice strong{display:block}
.code{font:700 2.2rem/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.3em;text-align:center;padding:.6rem 0 .2rem;color:var(--ink)}
#vc{text-align:center;font-size:1.6rem;letter-spacing:.4em;font-family:ui-monospace,Menlo,Consolas,monospace}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
.gd{display:flex;flex-direction:column;align-items:flex-start;gap:.1rem;padding:1.1rem;font:inherit;letter-spacing:inherit;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:1.2rem;box-shadow:var(--shadow);cursor:pointer;text-align:left}
.gd:hover{border-color:var(--accent)}.gd[aria-pressed=true]{border-color:var(--accent);background:var(--tint)}
.gd b{font-size:2.4rem;line-height:1.1;color:var(--accent)}.gd span{color:var(--soft);font-size:.9rem}
.center{text-align:center}.center .brand{justify-content:center;margin:1.5rem 0 0}.center h1{margin-top:1rem}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:1rem;align-items:start}
.avatar{width:5rem;height:5rem;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--accent);font-weight:700;font-size:1.5rem;margin-bottom:.5rem}
.tags{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0}
.chat{background:var(--card);border:1px solid var(--line);border-radius:1.3rem;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;max-width:46rem}
.ch{display:flex;gap:.8rem;align-items:center;padding:.9rem 1.1rem;border-bottom:1px solid var(--line)}.ch span.d{display:block;color:var(--soft);font-size:.85rem}
.log{padding:1rem;display:flex;flex-direction:column;gap:.8rem;min-height:15rem;max-height:min(52vh,28rem);overflow:auto}
.m{display:flex;gap:.6rem;max-width:90%}.m.me{align-self:flex-end;flex-direction:row-reverse}
.mb{padding:.7rem 1rem;border-radius:1.1rem;white-space:pre-wrap}
.m.bot .mb{background:var(--tint);border-top-left-radius:.3rem}.m.me .mb{background:var(--accent);color:var(--accent-ink);border-top-right-radius:.3rem}
.mb .btn{margin-top:.5rem;min-height:2.2rem;padding:.3rem .8rem;font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;padding:0 1rem .8rem}
.chips button{font:inherit;font-size:.88rem;letter-spacing:inherit;padding:.4rem .9rem;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}.chips button:hover{border-color:var(--accent)}
.cin{display:flex;gap:.6rem;padding:.8rem;border-top:1px solid var(--line)}.cin .btn{padding:.5rem 1rem}
.pv{font-size:1.1rem;line-height:1.9}
@media (max-width:56rem){
#nav{position:fixed;left:0;right:0;bottom:0;z-index:6;justify-content:space-around;gap:0;background:var(--card);border-top:1px solid var(--line);padding:.35rem max(.3rem,env(safe-area-inset-right,0px)) calc(.35rem + env(safe-area-inset-bottom,0px)) max(.3rem,env(safe-area-inset-left,0px))}
#nav a{flex:1;min-width:0;flex-direction:column;gap:.1rem;font-size:11px;padding:.35rem .1rem;text-align:center;line-height:1.3;letter-spacing:0;word-spacing:0}
main{padding-bottom:calc(6rem + env(safe-area-inset-bottom,0px))}
.two-col{grid-template-columns:1fr}
}
@media (max-width:46rem){
.hero{grid-template-columns:1fr;padding:1.6rem}.hero-a{display:none}
.duo,.auth{grid-template-columns:1fr}.auth-art{display:none}.auth-form{padding:1.5rem 1.2rem}
.auth{margin-top:.8rem}.auth-form .brand{display:flex}
}
@media (max-width:34rem){
.steps button:not([aria-selected=true]) span{display:none}
.two{grid-template-columns:1fr}.grades{grid-template-columns:1fr 1fr;gap:.7rem}.grid{grid-template-columns:1fr 1fr;gap:.7rem}.sub{padding:.9rem}.lcard{padding:1.1rem}.read{font-size:1.08rem}
.act .grp{width:100%}.act .btn{flex:1}
}

"9-english-0":{l:"A novel tells a long story. World literature means novels from many countries and cultures. When you read one, look at the setting, the characters and the theme. The theme is the big idea the story is about, like freedom or family.",x:"In a story about a boy who leaves his village for a city, the setting is the village and the city. The theme could be growing up, or finding where you belong.",a:["Pick a book you know. What is its theme in one sentence?","Any clear sentence works. A good one names the big idea, such as friendship or courage, and links it to the story."],q:[["What is a novel?",["A long story","A short poem","A news report"],0],["What is the setting of a story?",["The ending","Where and when it happens","The narrator's name"],1],["What is a theme?",["The big idea of a story","A character's name","The first line"],0],["Why read novels from other countries?",["To learn about other cultures and views","To avoid new ideas","To skip the plot"],0],["A novel shows rich and poor people living very differently in one city. Which theme is most likely?",["Adventure at sea","Friendship","Inequality"],2]]},
"9-english-1":{l:"A tragedy is a play with a sad ending. The main character is called the tragic hero. This person is often noble but has a flaw. The flaw leads to their downfall. In Shakespeare's Macbeth, the flaw is ambition.",x:"Macbeth wants to be king. His ambition pushes him to do terrible things. In the end he loses everything. That is a tragic downfall.",a:["Name a flaw that could ruin a hero in a play.","Examples: pride, jealousy, ambition or anger. The flaw must cause the hero's downfall."],q:[["What kind of ending does a tragedy have?",["Sad","Funny","No ending"],0],["Who is the main character in a tragedy called?",["The narrator","The tragic hero","The audience"],1],["What is a tragic flaw?",["A weakness that leads to the hero's fall","A mistake in the script","A costume problem"],0],["Which flaw drives Macbeth?",["Laziness","Ambition","Shyness"],1],["Why does the audience feel pity for a tragic hero?",["The hero is always evil","The hero wins easily","The hero is mostly good, but the flaw ruins them"],2]]},
"9-english-2":{l:"Critical theory gives us different lenses to read a text. A lens is a way of looking. A feminist lens asks how women are shown. A Marxist lens looks at money, class and power. A postcolonial lens looks at empire and culture. Each lens finds different meanings in the same text.",x:"Take the story of Cinderella. A feminist lens asks why she waits to be rescued. A Marxist lens asks about her low social class.",a:["Choose a lens and ask one question about a story you know.","A good answer starts from the lens. For example: What does this story say about power and money? (Marxist lens)"],q:[["What is a lens in critical theory?",["A way of looking at a text","A type of camera","A book cover"],0],["Can one text be read with more than one lens?",["No","Only poems","Yes"],2],["Which lens asks about money, class and power?",["Marxist","Feminist","Postcolonial"],0],["Which lens asks how women are shown?",["Postcolonial","Marxist","Feminist"],2],["A critic studies how a novel shows a colony and its ruling empire. Which lens fits?",["Feminist","Postcolonial","Marxist"],1]]},
"9-english-3":{l:"An editorial gives the opinion of a newspaper. An op-ed gives the opinion of one writer. Both try to persuade. A good one has a clear claim, evidence, a fair look at the other side, and a strong ending. Use facts, not only feelings.",x:"Claim: schools should start later. Evidence: tired teenagers learn less. Other side: later starts change bus times. Ending: ask readers to support the change.",a:["Write one claim for an op-ed about school.","Example: Schools should offer more audio books. A claim is one clear opinion that can be argued."],q:[["What does an op-ed give?",["A writer's opinion","Only news facts","A weather report"],0],["What is the aim of an editorial?",["To confuse","To persuade","To list names"],1],["What is a claim?",["The main opinion you argue","A quote from a friend","The title page"],0],["Why mention the other side?",["It makes the piece longer","It hides your opinion","It makes your argument fairer and stronger"],2],["Which sentence is the best evidence?",["I feel it is right","A survey of 500 students found most prefer later starts","Everyone knows it is true"],1]]},
"9-english-4":{l:"A documentary shows real events and people. Filmmakers still make choices. They choose what to film, what to cut and what music to add. Look for interviews, archive footage, narration and music. Ask: whose voice is heard? What is left out?",x:"A documentary about a river plays sad music over a factory. The music tells you how to feel. A different film might use calm music.",a:["Name one technique a documentary can use.","Examples: interviews, narration, archive footage, music or graphics."],q:[["What does a documentary show?",["Real events and people","Only made-up stories","Cartoons only"],0],["Which is a documentary technique?",["Rhyme","Interview","Plot twist"],1],["What is narration?",["A voice that explains what we see","A film poster","A camera lens"],0],["Why does music matter in a documentary?",["It makes the film shorter","It has no effect","It shapes how we feel"],2],["A film only interviews people on one side of an issue. What is the problem?",["It is too long","It may be biased","It has no sound"],1]]},
"9-maths-0":{l:"A quadratic has an x squared term. It looks like ax² + bx + c. Its graph is a U-shape called a parabola. To solve one, you can factorise it. Then set each bracket to zero.",x:"Solve x² + 5x + 6 = 0. Factorise: (x + 2)(x + 3) = 0. So x = −2 or x = −3.",a:["Solve x² − 9 = 0.","(x − 3)(x + 3) = 0, so x = 3 or x = −3."],q:[["What shape is the graph of a quadratic?",["Parabola","Straight line","Circle"],0],["Which is a quadratic?",["x² + 2x + 1","2x + 1","x + 5"],0],["Factorise x² + 5x + 6.",["(x + 1)(x + 6)","(x + 2)(x + 3)","(x − 2)(x − 3)"],1],["Solve (x − 4)(x + 1) = 0.",["x = −4 or x = 1","x = 4 or x = −1","x = 4 or x = 1"],1],["What are the solutions of x² − 5x + 6 = 0?",["x = −2 or x = −3","x = 1 or x = 6","x = 2 or x = 3"],2]]},
"9-maths-1":{l:"A function gives one output for each input. We write f(x). A transformation changes a graph. f(x) + 3 moves the graph up 3. f(x − 2) moves it right 2. −f(x) flips it over the x-axis. 2f(x) stretches it up.",x:"If f(x) = x², then f(x) + 3 = x² + 3. The U-shape moves up 3 units.",a:["Which way does f(x − 2) move the graph?","It moves the graph 2 units to the right."],q:[["What does f(x) + 3 do to a graph?",["Moves it up 3","Moves it down 3","Moves it right 3"],0],["What does −f(x) do?",["Flips it over the x-axis","Moves it left","Makes it wider"],0],["What does f(x − 2) do?",["Moves it left 2","Moves it right 2","Moves it up 2"],1],["What does 2f(x) do?",["Moves it up 2","Flips it","Stretches it vertically by 2"],2],["f(x) = x². Which function moves its graph 1 left and 4 down?",["(x − 1)² − 4","(x + 1)² − 4","(x + 1)² + 4"],1]]},
"9-maths-2":{l:"A sequence is a list of numbers in order. In an arithmetic sequence you add the same number each time. That number is the common difference, d. The nth term is a + (n − 1)d. In a geometric sequence you multiply by the same number each time.",x:"Take the sequence 3, 7, 11, 15. The difference is 4. The 10th term is 3 + 9 × 4 = 39.",a:["Find the next term: 2, 6, 18, 54, …","Multiply by 3 each time. The next term is 162."],q:[["In an arithmetic sequence, what do you do each step?",["Add the same number","Multiply by the same number","Square the term"],0],["Next term: 5, 8, 11, 14, …",["16","17","18"],1],["Is 2, 4, 8, 16 arithmetic or geometric?",["Arithmetic","Geometric","Neither"],1],["Find the 10th term of 3, 7, 11, …",["43","40","39"],2],["A geometric sequence starts 2, 6, 18. What is the 5th term?",["54","162","486"],1]]},
"9-maths-3":{l:"Use the sine rule when you know a side and its opposite angle. It says a ÷ sin A = b ÷ sin B. Use the cosine rule when you know two sides and the angle between them, or all three sides. It says c² = a² + b² − 2ab cos C. Both work in any triangle, not just right-angled ones.",x:"A triangle has a = 5, b = 7 and the angle between them is 60°. Then c² = 25 + 49 − 70 × 0.5 = 39. So c is about 6.2.",a:["When do you use the sine rule?","When you know a side and its opposite angle, and need another side or angle."],q:[["Do the sine and cosine rules work in triangles that are not right-angled?",["Yes","No","Only isosceles ones"],0],["Which rule is a ÷ sin A = b ÷ sin B?",["Cosine rule","Sine rule","Pythagoras"],1],["You know two sides and the angle between them. Which rule finds the third side?",["Sine rule","Cosine rule","Neither"],1],["Which formula is the cosine rule?",["a ÷ sin A = b ÷ sin B","c = a + b","c² = a² + b² − 2ab cos C"],2],["a = 5, b = 7 and angle C = 60°. What is c²?",["74","39","109"],1]]},
"9-maths-4":{l:"A vector has size and direction. A scalar has size only. We can write a vector as a column, like (3, 4). Add vectors by adding their parts. The size, or magnitude, of (3, 4) is √(3² + 4²) = 5.",x:"Walk 3 steps east and 4 steps north. That is the vector (3, 4). You end up 5 steps from the start in a straight line.",a:["Add (1, 2) and (3, 5).","Add the tops and the bottoms: (4, 7)."],q:[["What two things does a vector have?",["Size and direction","Colour and shape","Speed only"],0],["Which is a vector?",["Mass","Velocity","Temperature"],1],["Add (1, 2) and (3, 5).",["(4, 7)","(3, 10)","(2, 3)"],0],["What is the magnitude of (3, 4)?",["7","12","5"],2],["a = (2, −1) and b = (−3, 4). What is a + 2b?",["(−1, 3)","(−4, 7)","(−4, 3)"],1]]},
"9-maths-5":{l:"Probability tells us how likely something is. It is a number from 0 to 1. 0 means impossible. 1 means certain. Probability = favourable outcomes ÷ total outcomes. The probabilities of all outcomes add up to 1.",x:"A bag has 3 red and 2 blue balls. The chance of picking red is 3 out of 5, or 3/5.",a:["What is the chance of rolling a 6 on a fair die?","1 out of 6, or 1/6."],q:[["What does a probability of 0 mean?",["Impossible","Certain","Fifty-fifty"],0],["What is the probability of heads on a fair coin?",["1/4","1/2","1"],1],["A bag has 3 red and 2 blue balls. What is P(red)?",["3/5","2/5","3/2"],0],["P(rain) = 0.3. What is P(no rain)?",["0.3","1.3","0.7"],2],["Two fair coins are tossed. What is P(two heads)?",["1/2","1/4","1/3"],1]]},
"9-biology-0":{l:"Cells are the building blocks of life. The nucleus holds DNA. Mitochondria release energy. The cell membrane controls what goes in and out. Enzymes are proteins that speed up reactions in cells. Each enzyme fits one substrate, like a key in a lock.",x:"The enzyme amylase in your saliva breaks starch into sugar. It works best near body temperature.",a:["What happens to an enzyme if it gets too hot?","It changes shape, or denatures, and stops working."],q:[["Which part of the cell holds DNA?",["Nucleus","Membrane","Mitochondrion"],0],["What do mitochondria do?",["Store DNA","Release energy","Make cell walls"],1],["What is an enzyme?",["A protein that speeds up reactions","A type of sugar","A cell wall"],0],["The lock and key idea says an enzyme fits…",["Any molecule","One specific substrate","Only water"],1],["Why does a very hot enzyme stop working?",["It runs out of water","It turns into DNA","Its shape changes (it denatures)"],2]]},
"9-biology-1":{l:"Living things are made of four main groups of biomolecules. Carbohydrates give quick energy. Lipids store energy and make membranes. Proteins build and repair the body, and work as enzymes. Nucleic acids, like DNA, carry genetic information.",x:"Bread is rich in carbohydrates. Eggs are rich in protein. Butter is rich in lipids.",a:["Which biomolecule is DNA?","DNA is a nucleic acid."],q:[["Which biomolecule gives quick energy?",["Carbohydrates","Nucleic acids","Vitamins"],0],["DNA is a…",["Lipid","Nucleic acid","Carbohydrate"],1],["Which group do enzymes belong to?",["Proteins","Lipids","Carbohydrates"],0],["Which group stores energy and forms membranes?",["Proteins","Nucleic acids","Lipids"],2],["Proteins are made of long chains of which small units?",["Glucose","Fatty acids","Amino acids"],2]]},
"9-biology-2":{l:"Body systems work together. The circulatory system moves blood with the heart. The nervous system sends signals with the brain and nerves. The immune system fights germs. White blood cells find and destroy germs.",x:"You cut your finger. Your blood clots. White blood cells fight germs. Nerves send a pain signal to your brain.",a:["What is the job of the heart?","It pumps blood around the body."],q:[["What does the heart do?",["Pumps blood","Digests food","Makes sound"],0],["Which system sends signals to the brain?",["Skeletal","Nervous","Digestive"],1],["Which cells fight germs?",["White blood cells","Red blood cells","Skin cells"],0],["What do red blood cells carry?",["Germs","Hormones only","Oxygen"],2],["A vaccine helps the immune system by…",["Replacing your blood","Training it to recognise a germ","Killing all your cells"],1]]},
"9-biology-3":{l:"Photosynthesis happens in chloroplasts. Plants use light, water and carbon dioxide to make glucose and oxygen. Respiration happens in mitochondria. Cells use glucose and oxygen to release energy. Respiration makes carbon dioxide and water.",x:"In the day, a leaf takes in carbon dioxide and makes sugar and oxygen. Your cells use that oxygen and sugar to get energy.",a:["Write the inputs of photosynthesis.","Light, water and carbon dioxide."],q:[["Which gas do plants take in for photosynthesis?",["Oxygen","Carbon dioxide","Nitrogen"],1],["Which gas do plants make that we breathe?",["Oxygen","Smoke","Steam"],0],["Where does photosynthesis happen?",["Mitochondria","Nucleus","Chloroplasts"],2],["What does respiration release?",["Light","Energy","Sound"],1],["Which statement is true?",["Photosynthesis makes glucose and respiration uses it","Respiration makes glucose and photosynthesis uses it","They are the same process"],0]]},
"9-chemistry-0":{l:"Atoms are made of three particles. Protons are positive and sit in the nucleus. Neutrons have no charge and sit in the nucleus. Electrons are negative and move in shells. The atomic number is the number of protons. The mass number is protons plus neutrons.",x:"Carbon has 6 protons. Its atomic number is 6. Carbon-12 has 6 neutrons, so its mass number is 12.",a:["An atom has 11 protons and 12 neutrons. What is its mass number?","11 + 12 = 23."],q:[["Which particle has a negative charge?",["Proton","Neutron","Electron"],2],["Where are protons found?",["In the nucleus","In the outer shell","Outside the atom"],0],["What is the atomic number?",["Number of neutrons","Number of protons","Number of shells"],1],["Mass number equals…",["Protons + neutrons","Protons + electrons","Neutrons only"],0],["An atom has 11 protons, 12 neutrons and 11 electrons. What is its mass number?",["11","22","23"],2]]},
"9-chemistry-1":{l:"The periodic table is arranged by atomic number. Elements in the same group have similar properties. Across a period, atoms get smaller. Down a group, atoms get bigger. Across a period, it gets harder to remove an electron. This energy is called ionisation energy.",x:"Sodium and potassium are both in Group 1. Both react with water. Potassium is bigger and reacts more strongly.",a:["Down a group, do atoms get bigger or smaller?","Bigger. More electron shells are added."],q:[["How is the periodic table ordered?",["By atomic number","By colour","By alphabet"],0],["Elements in the same group have…",["Identical mass","Similar properties","No electrons"],1],["Going down a group, atomic radius…",["Increases","Decreases","Stays the same"],0],["Going across a period, atomic radius generally…",["Increases","Doubles","Decreases"],2],["Why does atomic radius increase down a group?",["Fewer electrons","More electron shells","A smaller nucleus"],1]]},
"9-chemistry-2":{l:"Ionic bonds form when electrons are transferred. A metal gives electrons to a non-metal. This makes ions with opposite charges that attract. Covalent bonds form when atoms share electrons. Metallic bonds hold metal atoms in a sea of free electrons. That is why metals conduct electricity.",x:"Sodium chloride is ionic. Sodium gives an electron to chlorine. Water is covalent. Oxygen shares electrons with hydrogen.",a:["Which bond shares electrons?","The covalent bond."],q:[["In a covalent bond, electrons are…",["Transferred","Shared","Destroyed"],1],["Which bond is in sodium chloride (salt)?",["Ionic","Covalent","Metallic"],0],["Why do metals conduct electricity?",["They are hard","They are shiny","Free electrons can move"],2],["What forms when an atom gives away an electron?",["A negative ion","A positive ion","A neutron"],1],["Which pair is most likely to form an ionic compound?",["Carbon and oxygen","Sodium and chlorine","Hydrogen and oxygen"],1]]},
"9-chemistry-3":{l:"A mole is a fixed amount of particles. One mole has 6.02 × 10²³ particles. Molar mass is the mass of one mole in grams. Moles = mass ÷ molar mass. In an equation, the big numbers in front show the mole ratio.",x:"Water, H₂O, has a molar mass of 18 g/mol. So 36 g of water is 2 moles.",a:["How many moles are in 44 g of CO₂ (molar mass 44 g/mol)?","44 ÷ 44 = 1 mole."],q:[["How many particles are in one mole?",["100","6.02 × 10²³","1 million"],1],["Moles = mass ÷ …",["Molar mass","Volume","Charge"],0],["How many moles are in 36 g of water (18 g/mol)?",["18","0.5","2"],2],["In 2H₂ + O₂ → 2H₂O, how many moles of H₂ react with 1 mole of O₂?",["1","2","4"],1],["How many moles of water form from 4 moles of H₂ in 2H₂ + O₂ → 2H₂O?",["2","8","4"],2]]},
"9-chemistry-4":{l:"Energetics studies energy changes in reactions. An exothermic reaction gives out heat. The surroundings get hotter. An endothermic reaction takes in heat. The surroundings get colder. We measure the change as the enthalpy change, ΔH. For an exothermic reaction, ΔH is negative.",x:"Burning gas is exothermic. A cold pack is endothermic. It feels cold because it takes in heat.",a:["Is burning exothermic or endothermic?","Exothermic. It gives out heat."],q:[["An exothermic reaction…",["Takes in heat","Gives out heat","Makes no change"],1],["Which is exothermic?",["Melting ice","A cold pack","Burning"],2],["What is the sign of ΔH for an exothermic reaction?",["Negative","Positive","Zero"],0],["In an endothermic reaction, the surroundings…",["Get hotter","Get colder","Stay the same"],1],["Which statement is correct?",["Breaking bonds is exothermic; making bonds is endothermic","Breaking bonds is endothermic; making bonds is exothermic","Both are exothermic"],1]]},
"9-physics-0":{l:"Kinematics describes motion. Speed is distance ÷ time. Acceleration is how fast velocity changes. For constant acceleration, v = u + at. Dynamics explains why things move. Newton's second law says F = ma.",x:"A car speeds up from 0 to 20 m/s in 5 s. Acceleration = 20 ÷ 5 = 4 m/s².",a:["Find the force on a 2 kg mass that accelerates at 3 m/s².","F = ma = 2 × 3 = 6 N."],q:[["Speed = distance ÷ …",["Mass","Time","Force"],1],["What is the unit of acceleration?",["m/s²","m/s","kg"],0],["A car goes from 0 to 20 m/s in 5 s. What is its acceleration?",["100 m/s²","4 m/s²","25 m/s²"],1],["Newton's second law is…",["v = fλ","E = mc²","F = ma"],2],["A 5 kg object has a 20 N net force. What is its acceleration?",["0.25 m/s²","100 m/s²","4 m/s²"],2]]},
"9-physics-1":{l:"Work is done when a force moves something. Work = force × distance. The unit is the joule, J. Energy is the ability to do work. Power is the rate of doing work. Power = work ÷ time. The unit is the watt, W.",x:"You push a box with 10 N for 3 m. Work = 10 × 3 = 30 J. If it takes 6 s, power = 30 ÷ 6 = 5 W.",a:["What is the unit of power?","The watt (W)."],q:[["What is the unit of work and energy?",["Watt","Joule","Newton"],1],["Power is the rate of doing…",["Work","Heat","Mass"],0],["A 10 N force moves a box 3 m. How much work is done?",["13 J","3.3 J","30 J"],2],["30 J of work is done in 6 s. What is the power?",["180 W","5 W","24 W"],1],["A 2 kg ball is lifted 5 m. Take g = 10 m/s². How much gravitational potential energy does it gain?",["10 J","50 J","100 J"],2]]},
"9-physics-2":{l:"Temperature measures how hot something is. Heat is energy that flows from hot to cold. Gas particles move fast and hit the walls of their container. This causes pressure. Boyle's law says that at constant temperature, if the volume goes down, the pressure goes up. Use kelvin for gas laws. K = °C + 273.",x:"Squeeze a bicycle pump. The volume gets smaller. The pressure goes up.",a:["Convert 27 °C to kelvin.","27 + 273 = 300 K."],q:[["Heat flows from…",["Cold to hot","Hot to cold","Nowhere"],1],["What causes gas pressure?",["Particles hitting the walls","Particles sleeping","Gravity only"],0],["Boyle's law: when volume goes down, pressure…",["Goes down","Stays the same","Goes up"],2],["Convert 27 °C to kelvin.",["246 K","300 K","27 K"],1],["A gas has a pressure of 100 kPa at 2 L. It is squeezed to 1 L at the same temperature. What is the new pressure?",["50 kPa","100 kPa","200 kPa"],2]]},
"9-physics-3":{l:"Waves can reflect, refract and diffract. Reflection is bouncing off a surface. The angle in equals the angle out. Refraction is bending when a wave changes speed, like light entering water. Diffraction is spreading around an edge or through a gap. Wave speed v = f × λ.",x:"A straw looks bent in a glass of water. Light refracts as it passes from water to air.",a:["What is refraction?","It is the bending of a wave when it changes speed in a new material."],q:[["Reflection is a wave…",["Bending in water","Bouncing off a surface","Spreading out"],1],["A straw looks bent in water because of…",["Reflection","Sound","Refraction"],2],["Wave speed v = …",["f ÷ λ","f × λ","f + λ"],1],["The angle of incidence is 30°. What is the angle of reflection?",["60°","15°","30°"],2],["A wave has a frequency of 5 Hz and a wavelength of 2 m. What is its speed?",["2.5 m/s","10 m/s","7 m/s"],1]]},
"9-society-0":{l:"World War I lasted from 1914 to 1918. It began after the assassination of Archduke Franz Ferdinand. Countries were tied together by alliances. The war ended with the Treaty of Versailles in 1919. World War II lasted from 1939 to 1945. It began when Germany invaded Poland. It ended in 1945 after the defeat of Germany and Japan.",x:"Many historians say the harsh terms of Versailles left Germany angry. That anger helped extreme leaders gain support in the 1930s.",a:["In which years did World War II take place?","1939 to 1945."],q:[["When did World War I start?",["1939","1914","1950"],1],["World War II began when Germany invaded…",["Spain","Canada","Poland"],2],["Which treaty ended World War I with Germany?",["Magna Carta","Treaty of Versailles","Treaty of Rome"],1],["Which event started World War I?",["The Great Fire","The Cold War","The assassination of Archduke Franz Ferdinand"],2],["Why do many historians link Versailles to World War II?",["It gave Germany many colonies","Its harsh terms caused anger in Germany","It created the United Nations"],1]]},
"9-society-1":{l:"In an authoritarian state, power is held by a small group or one leader. People have few freedoms. Elections may be fake or missing. Totalitarian states go further. They try to control all parts of life, including media, schools and beliefs. They often use propaganda and secret police.",x:"In Germany and the Soviet Union in the 1930s, leaders controlled newspapers and radio. People who spoke against the state were punished.",a:["What is propaganda?","Information used to push people to believe something, often one-sided."],q:[["In an authoritarian state, who holds the power?",["All citizens equally","A small group or one leader","Nobody"],1],["Which freedom is usually limited?",["Freedom of speech","Freedom to sleep","Freedom to eat"],0],["What is propaganda?",["A type of tax","A law book","One-sided information used to shape beliefs"],2],["Which tool does a totalitarian state often use?",["A free press","Open elections","Secret police"],2],["How is totalitarian rule different from authoritarian rule?",["It has more elections","It tries to control all parts of life","It has no leader"],1]]},
"9-society-2":{l:"Macroeconomic indicators show how a whole economy is doing. GDP is the total value of goods and services made in a country in a year. Inflation is the rise in prices over time. Unemployment is the share of people who want a job but cannot find one. Governments watch these numbers to make decisions.",x:"If prices rise from $100 to $105 in a year, inflation is 5%.",a:["What does GDP measure?","The total value of goods and services made in a country in a year."],q:[["What does GDP measure?",["The number of schools","The total value of goods and services made","The weather"],1],["Inflation is a rise in…",["Prices","Rainfall","Population only"],0],["What is unemployment?",["People who retire","People who study","People who want a job but cannot find one"],2],["Prices rise from $100 to $105 in a year. What is the inflation rate?",["105%","5%","0.5%"],1],["GDP falls for several months and unemployment rises. This most likely shows…",["A boom","A holiday","A recession"],2]]},
"9-society-3":{l:"Earth's crust is split into tectonic plates. Plates move slowly. Where they meet, we get earthquakes and volcanoes. At the coast, waves shape the land. Erosion wears rock away. Waves also carry sand and stones. This is transport. Deposition is when waves drop them. Erosion makes cliffs and caves. Deposition makes beaches.",x:"Waves hit the base of a cliff. Over many years they cut a cave, then an arch, then a stack.",a:["Name one landform made by deposition.","A beach (or a spit)."],q:[["What are tectonic plates?",["Pieces of the Moon","Large pieces of Earth's crust","Types of rock only"],1],["Which is a result of plates meeting?",["Rainbows","Snow","Earthquakes"],2],["What is coastal erosion?",["Waves dropping sand","Waves wearing rock away","Rain filling a lake"],1],["Deposition builds which landform?",["A cave","A cliff","A beach"],2],["Which order is correct as a headland is worn away?",["Stack, arch, cave","Cave, arch, stack","Arch, cave, stack"],1]]}
